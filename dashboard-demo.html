<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Dashboard Demo</title>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f6fa;color:#10213b}.w{max-width:1200px;margin:35px auto;padding:18px}h1{font-size:42px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.c{background:#fff;border-top:4px solid #d71920;border-radius:16px;padding:25px}.n{font-size:36px;color:#d71920;font-weight:800}.r{margin-top:25px;background:#fff;padding:28px;border-radius:16px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><h1>Event Dashboard</h1><div class="cards"><div class="c"><div class="n">1</div>Events</div><div class="c"><div class="n" id="q">0</div>QR Attendance</div><div class="c"><div class="n" id="m">36</div>Manual Attendance</div><div class="c"><div class="n" id="t">36</div>Total Attendance</div></div><div class="r"><b>Attendance rule:</b> Total Attendance = QR Attendance + Manual Attendance.<br><br><a href="index.html#attendance">Open QR Attendance Form</a></div></div><script>let q=+(localStorage.getItem("cud_demo_qr_count")||0),m=+(localStorage.getItem("cud_demo_manual_count")||36);document.getElementById("q").textContent=q;document.getElementById("m").textContent=m;document.getElementById("t").textContent=q+m;</script></body></html>
