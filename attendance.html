<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUD Event Attendance</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>CANADIAN UNIVERSITY DUBAI</b><small>CHEDS Event Attendance</small></div><span>Participant Attendance</span></header><main>
<div class="panel"><div class="eventbox"><b id="eventName">Event Attendance</b><br><span id="eventCode"></span></div>
<div class="flowtag">This attendance sheet is opened directly by the event QR. A successful submission is counted as <b>QR Attendance</b>.</div>
<form id="af" class="grid"><label class="wide">Participant Type*<select id="ptype" required><option value="">Select</option><option>CUD Student</option><option>CUD Faculty</option><option>CUD Staff</option><option>Guest</option></select></label>
<label>First Name*<input id="first" required></label><label>Last Name*<input id="last" required></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone"></label><label id="sidwrap">Student ID*<input id="sid"></label><label id="progwrap">Program<input id="program"></label><button class="primary wide">Submit Attendance</button></form>
<div id="done" class="success center hide"><h2>✓ Attendance Recorded</h2><p>Added to QR Attendance.</p><a class="linkbtn" href="index.html">Return to Demo</a></div>
</div></main><script>
const KEY="cud_demo4_events_v8",ATT="cud_demo4_att_v8";let id=+(new URLSearchParams(location.search).get("event")||0),a=JSON.parse(localStorage.getItem(KEY)||"[]"),ev=a.find(x=>x.id==id);
if(ev){eventName.textContent=ev.event_name;eventCode.textContent=ev.code}else{eventCode.textContent="Event ID: "+id}
function t(){let y=ptype.value==="CUD Student";sidwrap.style.display=y?"flex":"none";progwrap.style.display=y?"flex":"none";sid.required=y}ptype.onchange=t;t();
af.onsubmit=e=>{e.preventDefault();let k=(sid.value||email.value||phone.value||(first.value+"|"+last.value)).trim().toLowerCase(),all=JSON.parse(localStorage.getItem(ATT)||"{}"),list=all[id]||[];if(list.includes(k)){alert("Attendance already recorded.");return}list.push(k);all[id]=list;localStorage.setItem(ATT,JSON.stringify(all));let es=JSON.parse(localStorage.getItem(KEY)||"[]"),x=es.find(v=>v.id==id);if(x){x.qr=(x.qr||0)+1;localStorage.setItem(KEY,JSON.stringify(es))}af.classList.add("hide");done.classList.remove("hide")};
</script></body></html>
